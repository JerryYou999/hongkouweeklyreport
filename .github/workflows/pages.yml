name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check CloudBase deployment settings
        env:
          WEEKLY_REPORT_API_URL: ${{ vars.WEEKLY_REPORT_API_URL }}
        run: |
          if [ -z "$WEEKLY_REPORT_API_URL" ]; then
            echo "CloudBase HTTP API URL is missing; keeping the last successful Pages deployment."
            exit 1
          fi
      - name: Build static website
        env:
          VITE_WEEKLY_REPORT_API_URL: ${{ vars.WEEKLY_REPORT_API_URL }}
        run: npm run github:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
