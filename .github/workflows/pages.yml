name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check CloudBase deployment settings
        env:
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          CLOUDBASE_ACCESS_KEY: ${{ secrets.CLOUDBASE_ACCESS_KEY }}
        run: |
          if [ -z "$CLOUDBASE_ENV_ID" ] || [ -z "$CLOUDBASE_ACCESS_KEY" ]; then
            echo "CloudBase deployment settings are missing; keeping the last successful Pages deployment."
            exit 1
          fi
      - name: Build static website
        env:
          VITE_CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          VITE_CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION }}
          VITE_CLOUDBASE_FUNCTION_NAME: weekly-report-api
          VITE_CLOUDBASE_ACCESS_KEY: ${{ secrets.CLOUDBASE_ACCESS_KEY }}
        run: npm run github:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
