name = "hongkou-weekly-report-api"
main = "src/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

# 首次部署前运行 scripts/cloudflare-setup.ps1，并把生成的数据库 ID 填到下方。
[[d1_databases]]
binding = "DB"
database_name = "hongkou-weekly-report"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "hongkou-weekly-reports"

[vars]
# 正式发布后改成 GitHub Pages 或自定义域名的完整来源地址，不要带末尾斜杠。
FRONTEND_ORIGIN = "https://REPLACE_WITH_GITHUB_USER.github.io"
